<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlemingCore — gestão de estoque farmacêutico</title>
    <meta name="description" content="FlemingCore: alerta de vencimento, rastreabilidade e inteligência de estoque para farmácias." />
    <meta name="theme-color" content="#0F2438" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      /*
        Tema aplicado ANTES do primeiro pixel. Se isto esperasse o React,
        quem usa o modo escuro veria um flash branco a cada carregamento.
        A mesma chave e a mesma regra de theme/tema.tsx.
      */
      (function () {
        try {
          var t = localStorage.getItem('flemingcore.tema');
          if (t !== 'claro' && t !== 'escuro') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
          }
          document.documentElement.dataset.tema = t;
          if (t === 'escuro') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#020A14');
          }
        } catch (e) {
          document.documentElement.dataset.tema = 'claro';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
